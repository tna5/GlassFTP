# Builds GlassFTP.dmg on every push and publishes it as a GitHub release.
#
# - Default branch: a new release per push, tagged build-<run number> and
#   marked Latest, so the README's Download button always gets the newest DMG.
# - Any other branch: the same build and tests, with the DMG kept as an
#   artifact of the run instead of a release.
#
# Nothing is published unless `make test` passes first.
name: DMG

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dmg-${{ github.ref }}
  # A newer push to a branch supersedes the preview being built; releases on
  # the default branch always finish.
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  dmg:
    # macOS 26 SDK: the app uses the Liquid Glass APIs.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: make test

      - name: Stamp build number
        id: version
        run: |
          /usr/libexec/PlistBuddy -c "Set CFBundleVersion ${{ github.run_number }}" Resources/Info.plist
          echo "short=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        run: |
          make bundle CONFIG=release
          DMG_LAYOUT_TIMEOUT=60 ./scripts/make-dmg.sh

      - name: Publish
        # Releases come from the default branch only. Other branches keep their
        # DMG as a run artifact, so no branch name ends up on the Releases page.
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT: ${{ steps.version.outputs.short }}
          BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"

          # A merged pull request's commit subject is "Merge pull request #N
          # from <branch>"; its title is the first line of the body.
          summary="$(git log -1 --format=%s)"
          case "$summary" in
            "Merge pull request "*) summary="$(git log -1 --format=%b | sed -n '/./{p;q;}')" ;;
          esac

          {
            echo "${summary:-GlassFTP $SHORT}"
            echo
            echo "**Install:** open the DMG and drag GlassFTP onto Applications. The app is not notarized: on first launch, allow it in System Settings › Privacy & Security, or run \`xattr -dr com.apple.quarantine /Applications/GlassFTP.app\`."
          } > "$notes"

          gh release create "build-$BUILD" "dist/GlassFTP-$SHORT.dmg" \
            --target "$GITHUB_SHA" \
            --title "GlassFTP $SHORT (build $BUILD)" \
            --notes-file "$notes" \
            --latest

          # Earlier versions of this workflow published a pre-release per
          # branch; remove any that are left.
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | { grep '^preview-' || true; } \
            | while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done

      - name: Keep the DMG with the run
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: GlassFTP-dmg
          path: dist/*.dmg
          if-no-files-found: ignore
