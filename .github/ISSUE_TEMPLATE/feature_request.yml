name: Feature request
description: Suggest an idea for GlassFTP
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or workflow, and how the Finder handles it if relevant.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
