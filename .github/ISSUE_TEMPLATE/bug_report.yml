name: Bug report
description: Something in GlassFTP does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect to …
        2. Open the column view …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: GlassFTP version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.1"
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: SFTP server
      description: e.g. OpenSSH 9.6 on Ubuntu, Synology, a hosting provider…
